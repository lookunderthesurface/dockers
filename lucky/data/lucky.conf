entries:
  - name: "nextcloud-http"
    protocol: http
    port: 80
    host: "nextcloud.lkudsurf.online"
    rules:
      - action: redirect
        redirect:
          url: "https://nextcloud.lkudsurf.online"
          code: 301

  - name: "nextcloud-https"
    protocol: https
    port: 443
    host: "nextcloud.lkudsurf.online"
    certificate: "auto"
    routes:
      - path: /
        target: "http://127.0.0.1:8080"
        headers:
          - "Host: $host"
          - "X-Real-IP: $remote_addr"
          - "X-Forwarded-For: $proxy_add_x_forwarded_for"
          - "X-Forwarded-Proto: https"
          - "X-Forwarded-Host: $host"